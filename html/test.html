<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Menu Dropdown Mượt</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 40px;
    }

    .menu-chinh {
      list-style: none;
      display: flex;
      gap: 30px;
      background: #0077cc;
      padding: 15px 30px;
      border-radius: 8px;
    }

    .menu-chinh > li {
      position: relative;
    }

    .menu-chinh > li > a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      padding: 8px 12px;
      display: block;
    }

    .menu-chinh > li > a:hover {
      background: rgba(255,255,255,0.2);
      border-radius: 4px;
    }

    .menu-phu {
      position: absolute;
      top: 100%;
      left: 0;
      background: white;
      list-style: none;
      padding: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      opacity: 0;
      transform: translateY(10px);
      visibility: hidden;
      transition: all 0.3s ease;
      border-radius: 6px;
      min-width: 150px;
      z-index: 999;
    }

    .menu-phu li a {
      color: #333;
      text-decoration: none;
      display: block;
      padding: 8px 12px;
    }

    .menu-phu li a:hover {
      background-color: #f0f0f0;
      border-radius: 4px;
    }

    .dien-thoai:hover .menu-phu {
      opacity: 1;
      transform: translateY(0);
      visibility: visible;
    }
  </style>
</head>
<body>

  <ul class="menu-chinh">
    <li><a href="#">Trang chủ</a></li>
    <li class="dien-thoai">
      <a href="#">Điện thoại</a>
      <ul class="menu-phu">
        <li><a href="#">iPhone</a></li>
        <li><a href="#">Samsung</a></li>
        <li><a href="#">Xiaomi</a></li>
      </ul>
    </li>
    <li><a href="#">Liên hệ</a></li>
  </ul>

</body>
</html>
