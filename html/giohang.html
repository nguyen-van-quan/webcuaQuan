<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giỏ Hàng</title>
    <link rel="stylesheet" href="../CSS/giohang.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
  </head>
  <body class="animate__animated animate__fadeIn animate__slow">
    <div id="website">
      <div>
        <div class="quangcao1">
          <img src="..\imgs/anh-trang-chu/quangcao.png" />
        </div>
      </div>
      <div class="gio-hang">
        <h1>🛒 Giỏ Hàng Của Bạn</h1>

        <div class="san-pham">
          <a href=""
            ><img
              src="..\imgs\anh-trang-chu\iphone16-removebg-preview.png"
              alt="iPhone 16"
          /></a>
          <div class="thong-tin">
            <h2>iPhone 16</h2>
            <div class="gia">
              <p id="gia1">21.990.000</p>
              ₫
            </div>
            <div class="so-luong">
              <label for="sl1">Số lượng:</label>
              <input type="number" id="sl1" value="1" min="1" />
            </div>
            <button class="xoa">Xoá</button>
          </div>
        </div>

        <div class="san-pham">
          <a href="#"
            ><img
              src="..\imgs\anh-trang-chu\Samsung-s25ultra-khong-nen.png"
              alt="Samsung Galaxy"
          /></a>
          <div class="thong-tin">
            <h2>Samsung Galaxy S24 Ultra</h2>
            <div class="gia">
              <p id="gia2">29.990.000</p>
              ₫
            </div>
            <div class="so-luong">
              <label for="sl2">Số lượng:</label>
              <input type="number" id="sl2" value="2" min="1" />
            </div>
            <button class="xoa">Xoá</button>
          </div>
        </div>
        <div class="san-pham">
          <a href="#"
            ><img
              src="..\imgs\anh-trang-chu\RedMagic-9-Pro-Plus-removebg-preview.png"
              alt="Samsung Galaxy"
          /></a>
          <div class="thong-tin">
            <h2>Redmagic10</h2>
            <div class="gia">
              <p id="gia3">29.990.000</p>
              ₫
            </div>
            <div class="so-luong">
              <label for="sl2">Số lượng:</label>
              <input type="number" id="sl3" value="1" min="1" />
            </div>
            <button class="xoa">Xoá</button>
          </div>
        </div>

        <div class="tong">
          <p>
            Tổng cộng: <span class="tong-tien"><p id="giatien">0₫</p></span>
          </p>
          <button onclick="history.back()" class="thanh-toan">Thoát</button>
          <button class="thanh-toan">Thanh Toán</button>
        </div>
      </div>
      <div>
        <div class="quangcao2">
          <img src="..\imgs\anh-trang-chu\quangcao2.png" />
        </div>
      </div>
    </div>
  </body>
  <script>
    let sp1 = parseInt(document.getElementById("sl1").value);
    let sp2 = parseInt(document.getElementById("sl2").value);
    let sp3 = parseInt(document.getElementById("sl3").value);
    let gia1 = document.getElementById("gia1").textContent.replace(/[.,]/g, "");
    let gia2 = document.getElementById("gia2").textContent.replace(/[.,]/g, "");
    let gia3 = document.getElementById("gia3").textContent.replace(/[.,]/g, "");
    let tongtien = sp1 * gia1 + sp2 * gia2 + sp3 * gia3;
    let tong = tongtien.toLocaleString("vi-VN");
    document.getElementById("giatien").innerText = tong + "₫";
  </script>
</html>
