<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chi Tiết Sản Phẩm</title>
    <link rel="stylesheet" href="../CSS/chitietsanpham.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  </head>
  <body class="animate__animated animate__fadeIn animate__slow" >
    <div >
      <div class="quangcao1"><img  src="..\imgs\anh-trang-chu\quangcao.png" />
      </div>
      <div class="quangcao2"><img  src="..\imgs\anh-trang-chu\quangcao2.png"/>
      </div>
    </div>
    <div class="container">
      <div class="main">
        <div class="mainleft">
          <img
            class="image-big"
            src="../imgs/anh-trang-chu/iPhone-16ProMax-khong-nen.png"
            alt="Ảnh lớn"
            id="mainImage"
          />

          <div class="img-small">
            <img
              class="thumbnail"
              src="../imgs/anh-trang-chu/iPhone-16ProMax-khong-nen.png"
              alt="Red"
              onclick="changeImage(this)"
            />
            <img
              class="thumbnail"
              src="..\imgs\anh-chi-tiet-san-pham\iphone-16prm-1-removebg-preview.png"
              alt="Green"
              onclick="changeImage(this)"
            />
            <img
              class="thumbnail"
              src="../imgs\anh-chi-tiet-san-pham\ip16prm-2.jpg"
              alt="Blue"
              onclick="changeImage(this)"
            />
            <img
              class="thumbnail"
              src="../imgs\anh-chi-tiet-san-pham\iphone16prm-3.jpg"
              alt="Blue"
              onclick="changeImage(this)"
            />
          </div>
        </div>

        <div class="main-right">
          <h2>Điện thoại Iphone 16 Promax</h2>
          <p>256GB </p>
          <p class="price">35,000,000đ</p>
          <p><strong>Hãng:</strong>Apple</p>
          <p><strong>Ra Mắt:</strong> 1 Năm</p>
          <p><strong>Chipset:</strong> Apple A18 Pro</p>
          <p><strong>GPU:</strong> Apple GPU 6 nhân</p>
          <p><strong>Đánh giá:</strong> ⭐⭐⭐⭐⭐ 4.8/5</p>
          <div class="buttons">
            <a href="index.html"><button class="back-btn">⬅ Back</button></a>
            <button class="cart-btn">🛒 Thêm vào giỏ hàng</button>
          </div>
        </div>
      </div>

      <h3 class="related-products">Sản Phẩm Liên Quan</h3>
      <div class="main related-products main-bottom">
        <div class="col-3">
          <img
            src="../imgs/anh-trang-chu/iphone16-removebg-preview.png"
            alt="iphone 16"
          />
          <b>Iphone 16</b>
        </div>
        <div class="col-3">
          <img
          style="width: 120px;"
            src="../imgs\anh-chi-tiet-san-pham\iphone-16-pro.png"
            alt="Casper Wall Mount 2.0 HP"
          />
          <b>Iphone16pro</b>
        </div>
        <div class="col-3">
          <img style="width: 120px;"
            src="../imgs\anh-chi-tiet-san-pham\IPhone-15Plus.png"
            alt="iphone-15-plus"
          />
          <b>Iphone15plus</b>
        </div>
        <div class="col-3">
          <img
            src="../imgs\anh-chi-tiet-san-pham\iPhone15-Promax.png"
            alt="ip 15 promax"
          />
          <b>Iphone 15 Promax</b>
        </div>
        <div class="col-3">
          <img style="width: 120px;"
            src="../imgs\anh-chi-tiet-san-pham\ip14promax.png"
            alt="ip 14 promax"
          />
          <b>Iphone 14 Promax</b>
        </div>
      </div>
    </div>
  </body>
  <script>
    function changeImage(smallImg) {
      let mainImg = document.getElementById("mainImage");
      mainImg.style.opacity = "0"; // Hiệu ứng mờ trước khi đổi ảnh
      setTimeout(() => {
        mainImg.src = smallImg.src.replace("/100/", "/600/"); // Thay đổi ảnh lớn
        mainImg.style.opacity = "1"; // Hiện ảnh mới
      }, 200);
    }
  </script>
</html>
