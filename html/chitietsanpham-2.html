<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chi Tiết Sản Phẩm</title>
    <link rel="stylesheet" href="../CSS/chitietsanpham.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
  </head>
  <body class="animate__animated animate__fadeIn animate__slow">
    <div id="website">
      <div>
        <div class="quangcao1">
          <img src="..\imgs\anh-trang-chu\quangcao.png" />
        </div>
        
      </div>
      <div class="container">
        <div class="main">
          <div class="mainleft">
            <img
              class="image-big"
              src="../imgs\anh-trang-chu\Samsung-s25ultra-khong-nen.png"
              alt="Ảnh lớn"
              id="mainImage"
            />
  
            <div class="img-small">
              <img
                class="thumbnail"
                src="../imgs\anh-trang-chu\Samsung-s25ultra-khong-nen.png"
                alt="ảnh nhỏ"
                onclick="changeImage(this)"
              />
              <img
                class="thumbnail"
                src="..\imgs\anh-chi-tiet-san-pham\samsung-galaxy-s25-ultra1.jpg"
                alt="ảnh nhỏ"
                onclick="changeImage(this)"
              />
              <img
                class="thumbnail"
                src="../imgs\anh-chi-tiet-san-pham\samsung-galaxy-s25-ultra2.jpg"
                alt="ảnh nhỏ"
                onclick="changeImage(this)"
              />
              <img
                class="thumbnail"
                src="../imgs\anh-chi-tiet-san-pham\samsung-galaxy-s25-ultra3.jpg"
                alt="ảnh nhỏ"
                onclick="changeImage(this)"
              />
            </div>
          </div>
  
          <div class="main-right">
            <h2>Điện thoại SamSung 25 Ultra</h2>
            <p>512GB</p>
            <p class="price">26,990,000đ</p>
            <p><strong>Hãng:</strong>SamSung</p>
            <p><strong>Ra Mắt:</strong> 1 Năm</p>
            <p><strong>Chipset:</strong> Snapdragon 8 Elite</p>
            <p><strong>GPU:</strong> Adreno 830</p>
            <p><strong>Đánh giá:</strong> ⭐⭐⭐⭐⭐ 4.9/5</p>
            <div class="buttons">
              <button onclick="history.back()" class="back-btn">⬅ Back</button>
              <button class="cart-btn">🛒 Thêm vào giỏ hàng</button>
            </div>
          </div>
        </div>
  
        <h3 class="related-products">Sản Phẩm Liên Quan</h3>
        <div class="main related-products main-bottom">
          <div class="col-3">
            <img
              src="../imgs\anh-trang-chu\RedMagic-9-Pro-Plus-removebg-preview.png"
              alt="redmagic 10"
            />
            <b>Redmagic 10</b>
          </div>
          <div class="col-3">
            <img
              style="width: 120px"
              src="../imgs\anh-trang-chu\Vivo-X200-removebg-preview.png"
              alt="vivox200"
            />
            <b>ViVo x200</b>
          </div>
          <div class="col-3">
            <img
              style="width: 120px"
              src="../imgs\anh-trang-chu\Xiaomi-15-Ultra-removebg-preview.png"
              alt="xiaomi 15"
            />
            <b>Xiaomi 15 Ultra</b>
          </div>
          <div class="col-3">
            <img
              src="../imgs\anh-trang-chu\Oppo-Find-x8ultra-removebg-preview.png"
              alt="oppo find x8"
            />
            <b>OPPO Find x8 Ultra</b>
          </div>
          <div class="col-3">
            <img
              style="width: 120px"
              src="../imgs\anh-trang-chu\Asus-rog9.jpg"
              alt="rog 9"
            />
            <b>Rog phone 9</b>
          </div>
        </div> 
      </div>
        <div>
          <div class="quangcao2">
            <img src="..\imgs\anh-trang-chu\quangcao2.png" />
          </div>
        </div>
    </div>
  </body>
  <script>
    function changeImage(smallImg) {
      let mainImg = document.getElementById("mainImage");
      mainImg.style.opacity = "0"; // Hiệu ứng mờ trước khi đổi ảnh
      setTimeout(() => {
        mainImg.src = smallImg.src.replace("/100/", "/600/"); // Thay đổi ảnh lớn
        mainImg.style.opacity = "1"; // Hiện ảnh mới
      }, 200);
    }
  </script>
</html>
