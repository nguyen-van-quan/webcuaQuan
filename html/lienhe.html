<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liên Hệ</title>
    <link rel="stylesheet" href="..\CSS\lienhe.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body class="animate__animated animate__fadeIn animate__slow" >
    <h2>Liên Hệ Với Chúng Tôi</h2>
    <div class="container">
      <div id="thoat">
        <a onclick="history.back()"><i class="fa-solid fa-circle-xmark"></i></a>
      </div>
      <div class="contact-info">
        <div>
          <h3>Địa chỉ map</h3>
          <img src="..\imgs\anh-lien-he\bando.jpg" alt="Bản đồ" />
        </div>
        <div>
          <p>
            <strong><i class="fa-solid fa-phone"></i> Sđt:</strong> +84 123 456
            789
          </p>
          <p>
            <strong><i class="fa-solid fa-envelope"></i> Email:</strong>
            support@dienthoai.com
          </p>
          <p>
            <strong><i class="fa-brands fa-facebook"></i> Facebook:</strong>
            Nguyễn Dương
          </p>
          <p>
            <strong><i class="fa-brands fa-telegram"></i> Tele:</strong>
            support@dienthoai.com
          </p>
          <p>
            <strong><i class="fa-solid fa-location-dot"></i> Địa chỉ:</strong>
            258 Bạch Đằng
          </p>
        </div>
      </div>
      <div class="form-container">
        <h3 style="text-align: center; color: rgb(76, 0, 255)">
          Gửi Phản Hồi Cho Của Bạn 
        </h3>
        <form>
          <div class="form-group">
            <label for="name">Tên</label>
            <input type="text" id="name" placeholder="Nhập tên của bạn" />
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Nhập email của bạn" />
          </div>
          <div class="form-group">
            <label for="message">Nội dung</label>
            <textarea
              id="message"
              rows="5"
              placeholder="Nhập nội dung"
            ></textarea>
          </div>
          <button type="submit">Gửi</button>
        </form>
      </div>
    </div>
  </body>
</html>
